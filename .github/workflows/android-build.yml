name: XCoin Android CI/CD

on:
  push:
    branches: ["main", "develop", "feature/*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    # Proje kök dizini XCoin-RN klasörünün içinde olduğu için
    defaults:
      run:
        working-directory: ./XCoin-RN

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Versiyon commit'ini sorunsuz yapabilmesi için tüm history çekilir.

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./XCoin-RN/package-lock.json"

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          # Gradle cache otomatik sağlanır:
          cache: "gradle"

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: ⬆️ Bump Version
        run: ./scripts/build-android.sh bump

      - name: 🏗️ Build APK (Expo Prebuild & Gradle)
        run: ./scripts/build-android.sh build

      - name: 🚀 Upload to Firebase App Distribution
        run: ./scripts/build-android.sh upload
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTER_GROUP: xcoin-cicd

      - name: 💾 Push New Version to GitHub
        run: ./scripts/build-android.sh push
        env:
          # GitHub Actions, kendi içinde geçici bir token verir
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_BRANCH: origin/${{ github.ref_name }}

      - name: 🗄️ Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCoin-Release-APK
          path: XCoin-RN/build-output/*.apk
          retention-days: 7
